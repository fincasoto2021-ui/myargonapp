<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARGON™ | Crea tu Cuenta Gratis y Gana A-Coins (myargonapp.com)</title>
  <meta name="description" content="ARGON™ (myargonapp.com) - Regístrate gratis desde cero, recibe +5,000 A-Coins de bienvenida y sube a Rango Magnate." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0F131A; color: #F8FAFC; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PROFILE_CATEGORIES = [
      '🛻 Motores 4x4',
      '🎵 Música Urbana',
      '💼 Negocios y Finanzas',
      '😂 Comedia y Entretenimiento',
      '🏀 Deportes',
      '✨ Estilo de Vida',
      '🌾 Agro y Café'
    ];

    const RANKS = [
      { id: 'suscriptor', level: 1, name: 'Suscriptor', minFollowers: 0, badgeBg: 'bg-blue-500/20 text-blue-400 border-blue-500/30', icon: '🔹' },
      { id: 'magnate', level: 2, name: 'Magnate', minFollowers: 25000, badgeBg: 'bg-amber-500/20 text-amber-300 border-amber-500/40', icon: '🪙' },
      { id: 'boss', level: 3, name: 'Boss', minFollowers: 100000, badgeBg: 'bg-indigo-500/20 text-indigo-300 border-indigo-400/40', icon: '💎' },
      { id: 'capo', level: 4, name: 'Capo', minFollowers: 500000, badgeBg: 'bg-purple-500/20 text-purple-300 border-purple-500/40', icon: '🖤' },
      { id: 'leyenda', level: 5, name: 'Leyenda', minFollowers: 2000000, badgeBg: 'bg-rose-500/20 text-amber-300 border-amber-400/60', icon: '👑' }
    ];

    const TOPUP_PACKS = [
      { id: 'pack_199', name: 'Paquete Calle (El Más Vendido)', priceUSD: 1.99, aCoins: 6000, bonusText: '5,000 + 1,000 Gratis (Impulsa +30 seguidores reales)' },
      { id: 'pack_499', name: 'Paquete Impulso', priceUSD: 4.99, aCoins: 18000, bonusText: 'Ideal para destacar tu perfil en ARGON' },
      { id: 'pack_1499', name: 'Paquete Turbo Magnate', priceUSD: 14.99, aCoins: 60000, bonusText: 'Acelerador masivo de recompensas' }
    ];

    const FOUNDER_WELCOME_POST = {
      id: 'post_fundador_oficial',
      author: 'Alberto Soto',
      rankBadge: '👑 Fundador Oficial',
      avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300&auto=format&fit=crop&q=80',
      followers: 1,
      time: 'Mensaje Oficial de Bienvenida',
      content: '¡Bienvenidos oficialmente a ARGON™ (myargonapp.com)! 👑🚀 Arrancamos desde cero para que cada usuario real de Puerto Rico, EE. UU. y Latinoamérica construya su audiencia, gane A-Coins reales y suba a Rango Magnate. ¡Publica arriba e invita a tu gente por WhatsApp!',
      likes: 1,
      likedByMe: false,
      payingForFollow: true,
      followedByMe: false
    };

    function App() {
      const [activeTab, setActiveTab] = useState('inicio');
      const [toast, setToast] = useState(null);
      const [showTopUpModal, setShowTopUpModal] = useState(false);

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('argon_active_user_v1');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      const [regForm, setRegForm] = useState({
        name: '',
        emailOrPhone: '',
        category: '🎵 Música Urbana',
        location: 'Puerto Rico 🇵🇷',
        bio: ''
      });

      const [registeredMembers, setRegisteredMembers] = useState(() => {
        try {
          const saved = localStorage.getItem('argon_members_v1');
          if (saved) return JSON.parse(saved);
        } catch {}
        return [
          {
            id: 'founder_alberto',
            name: 'Alberto Soto (Fundador)',
            category: '👑 Fundador Oficial ARGON™',
            followers: 1
          }
        ];
      });

      const [posts, setPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('argon_posts_v1');
          if (saved) return JSON.parse(saved);
        } catch {}
        return [FOUNDER_WELCOME_POST];
      });

      const [newPostText, setNewPostText] = useState('');

      useEffect(() => {
        try {
          if (currentUser) localStorage.setItem('argon_active_user_v1', JSON.stringify(currentUser));
          else localStorage.removeItem('argon_active_user_v1');
        } catch {}
      }, [currentUser]);

      useEffect(() => {
        try { localStorage.setItem('argon_posts_v1', JSON.stringify(posts)); } catch {}
      }, [posts]);

      useEffect(() => {
        try { localStorage.setItem('argon_members_v1', JSON.stringify(registeredMembers)); } catch {}
      }, [registeredMembers]);

      const notify = (title, subtitle) => {
        setToast({ title, subtitle });
        setTimeout(() => setToast(null), 3200);
      };

      const handleRegisterUser = (e) => {
        e.preventDefault();
        if (!regForm.name.trim() || !regForm.emailOrPhone.trim()) return;

        const newUser = {
          id: 'u_' + Date.now(),
          name: regForm.name.trim(),
          emailOrPhone: regForm.emailOrPhone.trim(),
          category: regForm.category,
          location: regForm.location.trim() || 'Puerto Rico & USA',
          bio: regForm.bio.trim() || `Cuenta oficial en ARGON™ • ${regForm.category}`,
          avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(regForm.name.trim())}&background=F59E0B&color=0F131A&bold=true&size=256`,
          cover: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200&auto=format&fit=crop&q=80',
          aCoins: 5000,
          followers: 0,
          usdBalance: 0.00
        };

        setCurrentUser(newUser);
        setRegisteredMembers(prev => [{ id: newUser.id, name: newUser.name, category: newUser.category, followers: 0 }, ...prev]);
        notify('¡Bienvenido a ARGON™!', 'Recibiste tus +5,000 A-Coins de bienvenida.');
      };

      const handleShareWhatsApp = () => {
        const name = currentUser ? currentUser.name : 'ARGON™';
        const text = `👑 ¡Ya estoy activo en ARGON™ (${name})! Entra gratis ahora mismo a https://www.myargonapp.com , crea tu cuenta desde cero con +5,000 A-Coins de regalo y sígueme 🔥🚀`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-[#0F131A] text-white flex flex-col justify-between p-4 sm:p-8">
            <div className="max-w-5xl mx-auto w-full my-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-center py-6">
              <div className="lg:col-span-6 space-y-5">
                <span className="inline-block px-3.5 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-black">
                  👑 PLATAFORMA OFICIAL ABIERTA • MYARGONAPP.COM
                </span>
                <h1 className="text-3xl sm:text-5xl font-black leading-tight">
                  Bienvenido a <span className="text-amber-400">ARGON™</span>
                </h1>
                <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                  La red social donde todos empezamos desde cero, sin bots, ganando <strong>A-Coins reales</strong> por seguirnos e impulsando nuestras cuentas hasta <strong>Rango Magnate (25,000 seguidores)</strong> para cobrar patrocinios en dólares por Stripe.
                </p>
                <div className="grid grid-cols-3 gap-2.5 pt-2">
                  <div className="p-3 rounded-2xl bg-[#161B26] border border-slate-800">
                    <strong className="text-amber-400 text-sm sm:text-base block">+5,000 A-Coins</strong>
                    <span className="text-[11px] text-slate-400">Gratis al suscribirte</span>
                  </div>
                  <div className="p-3 rounded-2xl bg-[#161B26] border border-slate-800">
                    <strong className="text-emerald-400 text-sm sm:text-base block">100% Reales</strong>
                    <span className="text-[11px] text-slate-400">Empezamos desde cero</span>
                  </div>
                  <div className="p-3 rounded-2xl bg-[#161B26] border border-slate-800">
                    <strong className="text-amber-300 text-sm sm:text-base block">Pagos Stripe</strong>
                    <span className="text-[11px] text-slate-400">Desde Rango Magnate</span>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-6">
                <form onSubmit={handleRegisterUser} className="p-6 rounded-3xl bg-[#161B26] border-2 border-amber-500/40 shadow-2xl space-y-4">
                  <div className="border-b border-slate-800 pb-3">
                    <h2 className="text-xl font-black text-white">Crear Cuenta Gratis en ARGON™</h2>
                    <p className="text-xs text-slate-400">Recibe tus primeros 5,000 A-Coins al instante.</p>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Tu Nombre o Apodo *</label>
                      <input
                        type="text"
                        required
                        value={regForm.name}
                        onChange={(e) => setRegForm({ ...regForm, name: e.target.value })}
                        placeholder="Ej: Alberto Soto"
                        className="w-full px-4 py-3 rounded-xl bg-[#0F131A] border border-slate-700 text-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Correo Electrónico o WhatsApp *</label>
                      <input
                        type="text"
                        required
                        value={regForm.emailOrPhone}
                        onChange={(e) => setRegForm({ ...regForm, emailOrPhone: e.target.value })}
                        placeholder="Ej: tuemail@gmail.com o (787) 000-0000"
                        className="w-full px-4 py-3 rounded-xl bg-[#0F131A] border border-slate-700 text-white font-bold"
                      />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-amber-400 mb-1">Categoría</label>
                        <select
                          value={regForm.category}
                          onChange={(e) => setRegForm({ ...regForm, category: e.target.value })}
                          className="w-full px-3 py-3 rounded-xl bg-[#0F131A] border border-slate-700 text-white font-bold"
                        >
                          {PROFILE_CATEGORIES.map((c, i) => <option key={i} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Pueblo / País</label>
                        <input
                          type="text"
                          value={regForm.location}
                          onChange={(e) => setRegForm({ ...regForm, location: e.target.value })}
                          className="w-full px-3 py-3 rounded-xl bg-[#0F131A] border border-slate-700 text-white font-bold"
                        />
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm shadow-lg cursor-pointer"
                  >
                    👑 Suscribirme Ahora (+5,000 A-Coins Gratis)
                  </button>
                </form>
              </div>
            </div>

            <footer className="max-w-5xl mx-auto w-full pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
              © 2026 <strong className="text-amber-400">ARGON™</strong> (myargonapp.com) — Propiedad de <strong>ASD BUILDING SOLUTIONS LLC</strong> (Reg. #510231) y <strong>FINCA SOTO LLC</strong> (SURI #1433044-0010 • Adjuntas, PR 00601).
            </footer>
          </div>
        );
      }

      const currentRank = RANKS.slice().reverse().find(r => currentUser.followers >= r.minFollowers) || RANKS[0];

      const handleCreatePost = (e) => {
        e.preventDefault();
        if (!newPostText.trim()) return;
        const newPost = {
          id: 'p_' + Date.now(),
          author: currentUser.name,
          rankBadge: `${currentRank.icon} ${currentRank.name}`,
          avatar: currentUser.avatar,
          followers: currentUser.followers,
          time: 'Justo ahora',
          content: newPostText.trim(),
          likes: 0,
          likedByMe: false,
          payingForFollow: true,
          followedByMe: true
        };
        setPosts([newPost, ...posts]);
        setNewPostText('');
        notify('¡Publicado en ARGON™!', 'Ya está visible en el muro.');
      };

      return (
        <div className="min-h-screen bg-[#0F131A] text-slate-100">
          {toast && (
            <div className="fixed bottom-5 left-5 z-50 max-w-sm bg-slate-900 border-2 border-amber-400 text-amber-100 px-4 py-3 rounded-2xl shadow-2xl">
              <p className="font-black text-sm">🪙 {toast.title}</p>
              <p className="text-xs opacity-90">{toast.subtitle}</p>
            </div>
          )}

          <header className="sticky top-0 z-40 h-16 bg-[#161B26] border-b border-slate-800 px-3 sm:px-6 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <div onClick={() => setActiveTab('inicio')} className="flex items-center gap-2 cursor-pointer">
                <div className="w-9 h-9 rounded-full bg-amber-400 flex items-center justify-center text-slate-950 font-black">👑</div>
                <span className="font-black text-lg text-amber-400">ARGON™</span>
              </div>
              <button
                onClick={handleShareWhatsApp}
                className="px-3 py-1.5 rounded-full bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
              >
                📲 Invitar Amigos
              </button>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowTopUpModal(true)}
                className="px-3 py-1.5 rounded-full bg-amber-400 text-slate-950 font-black text-xs cursor-pointer"
              >
                🪙 {currentUser.aCoins.toLocaleString()} A (+$1.99)
              </button>
              <button
                onClick={() => setCurrentUser(null)}
                className="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold cursor-pointer"
              >
                Salir
              </button>
            </div>
          </header>

          <div className="max-w-6xl mx-auto px-3 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <aside className="lg:col-span-4 space-y-4">
              <div className="rounded-2xl bg-[#161B26] border border-slate-800 p-4 space-y-3">
                <div className="flex items-center gap-3">
                  <img src={currentUser.avatar} className="w-14 h-14 rounded-full object-cover border-2 border-amber-400" />
                  <div>
                    <h2 className="font-black text-base">{currentUser.name} ✔️</h2>
                    <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-full border ${currentRank.badgeBg}`}>
                      {currentRank.icon} {currentRank.name}
                    </span>
                  </div>
                </div>
                <div className="text-xs space-y-1 pt-2 border-t border-slate-800">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Mis Seguidores Reales:</span>
                    <strong className="text-white">{currentUser.followers}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Mis A-Coins:</span>
                    <strong className="text-amber-400">{currentUser.aCoins.toLocaleString()}</strong>
                  </div>
                </div>
                <button
                  onClick={handleShareWhatsApp}
                  className="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                >
                  📲 Compartir mi Link en WhatsApp
                </button>
              </div>

              <div className="p-4 rounded-2xl bg-[#161B26] border border-slate-800 space-y-2 text-xs">
                <h3 className="font-black text-amber-400 uppercase">👑 Pioneros Registrados</h3>
                {registeredMembers.map((m, idx) => (
                  <div key={m.id} className="px-3 py-2 rounded-xl bg-[#0F131A] flex justify-between">
                    <span><strong className="text-amber-400">#{idx + 1}</strong> {m.name}</span>
                    <span>{m.followers} seg</span>
                  </div>
                ))}
              </div>
            </aside>

            <main className="lg:col-span-8 space-y-4">
              <form onSubmit={handleCreatePost} className="p-4 rounded-2xl bg-[#161B26] border border-slate-800 flex gap-2">
                <input
                  type="text"
                  value={newPostText}
                  onChange={(e) => setNewPostText(e.target.value)}
                  placeholder={`¿Qué quieres publicar hoy en ARGON™, ${currentUser.name}?`}
                  className="flex-1 px-4 py-2.5 rounded-full bg-[#0F131A] text-sm text-white focus:outline-none"
                />
                <button type="submit" className="px-5 py-2.5 rounded-full bg-amber-500 text-slate-950 font-black text-xs cursor-pointer">
                  Publicar
                </button>
              </form>

              {posts.map(post => (
                <article key={post.id} className="rounded-2xl bg-[#161B26] border border-slate-800 p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <img src={post.avatar} className="w-10 h-10 rounded-full object-cover" />
                      <div>
                        <h3 className="font-bold text-sm">{post.author} <span className="text-amber-400 text-xs">({post.rankBadge})</span></h3>
                        <p className="text-xs text-slate-400">{post.followers} seguidores • {post.time}</p>
                      </div>
                    </div>
                    {post.payingForFollow && !post.followedByMe && (
                      <button
                        onClick={() => {
                          setPosts(posts.map(p => p.id === post.id ? { ...p, followedByMe: true, followers: p.followers + 1 } : p));
                          setCurrentUser(prev => ({ ...prev, aCoins: prev.aCoins + 50 }));
                          notify('+50 A-Coins Cobrados', `Empezaste a seguir a ${post.author}`);
                        }}
                        className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs cursor-pointer"
                      >
                        + Seguir (+50 A-Coins)
                      </button>
                    )}
                  </div>
                  <p className="text-sm text-slate-100">{post.content}</p>
                </article>
              ))}
            </main>
          </div>

          {showTopUpModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-[#161B26] border border-amber-400 p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-amber-400">Recargar A-Coins con Stripe</h3>
                  <button onClick={() => setShowTopUpModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                {TOPUP_PACKS.map(pack => (
                  <div key={pack.id} className="p-3.5 rounded-xl bg-[#0F131A] border border-slate-800 flex justify-between items-center">
                    <div>
                      <p className="font-black text-sm text-white">+{pack.aCoins.toLocaleString()} A-Coins</p>
                      <p className="text-[11px] text-slate-400">{pack.bonusText}</p>
                    </div>
                    <button
                      onClick={() => {
                        setCurrentUser(prev => ({ ...prev, aCoins: prev.aCoins + pack.aCoins }));
                        setShowTopUpModal(false);
                        notify(`¡+${pack.aCoins.toLocaleString()} A-Coins Recargados!`, `Pago Stripe $${pack.priceUSD} USD.`);
                      }}
                      className="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-black text-xs cursor-pointer"
                    >
                      Stripe ${pack.priceUSD}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
