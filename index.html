    function compressImageFile(file, maxWidth = 850, quality = 0.8) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(event.target.result);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

                  <p className="text-xs text-zinc-600">
                    {lang === 'en'
                      ? 'Reach 25,000 real followers (Magnate Rank) to unlock direct brand sponsorships paid via Stripe (80% Creator / 20% Platform).'
                      : 'Al alcanzar 25,000 seguidores reales (Rango Magnate), desbloqueas los patrocinios directos de marcas pagados por Stripe (80% Creador / 20% Plataforma).'}
                  </p>
                </div>
              )}

              {activeTab === 'perfil' && (
                <div className="p-6 rounded-2xl bg-white border border-zinc-200 space-y-3">
                  <h2 className="font-black text-xl text-zinc-950">{currentUser.name} ✔️</h2>
                  <p className="text-xs text-zinc-500">{currentUser.category}</p>
                  <p className="text-sm text-zinc-800">{currentUser.bio}</p>
                </div>
              )}
            </main>
          </div>

          {showEditProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-white border border-zinc-300 p-5 space-y-3 text-xs">
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-base text-zinc-950">{t.editProfile}</h3>
                  <button onClick={() => setShowEditProfileModal(false)} className="text-zinc-500 font-bold">✕</button>
                </div>
                <div>
                  <label className="block font-bold text-zinc-700 mb-1">{t.nameLabel}</label>
                  <input
                    type="text"
                    value={currentUser.name}
                    onChange={(e) => setCurrentUser({ ...currentUser, name: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-50 border border-zinc-300 text-zinc-950 font-bold"
                  />
                </div>
                <div>
                  <label className="block font-bold text-zinc-700 mb-1">{t.bioLabel}</label>
                  <input
                    type="text"
                    value={currentUser.bio}
                    onChange={(e) => setCurrentUser({ ...currentUser, bio: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-50 border border-zinc-300 text-zinc-950"
                  />
                </div>
                <button
                  onClick={() => setShowEditProfileModal(false)}
                  className="w-full py-3 rounded-xl bg-zinc-950 text-white font-black cursor-pointer"
                >
                  ✓
                </button>
              </div>
            </div>
          )}

          {activeStoryModal && (
            <div onClick={() => setActiveStoryModal(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="max-w-sm w-full rounded-3xl overflow-hidden bg-white">
                <img src={activeStoryModal.image} className="w-full h-[460px] object-cover" />
                <div className="p-4 flex justify-between items-center">
                  <p className="font-black text-sm text-zinc-950">{activeStoryModal.author}</p>
                  <button className="px-3 py-1 rounded-lg bg-zinc-100 text-xs font-bold">✕</button>
                </div>
              </div>
            </div>
          )}

          {showTopUpModal && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-white border border-zinc-300 p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-zinc-950">Stripe • A-Coins</h3>
                  <button onClick={() => setShowTopUpModal(false)} className="text-zinc-500 font-bold">✕</button>
                </div>
                {TOPUP_PACKS.map((pack) => (
                  <div key={pack.id} className="p-3.5 rounded-xl bg-zinc-50 border border-zinc-200 flex justify-between items-center">
                    <div>
                      <p className="font-black text-sm text-zinc-950">+{pack.aCoins.toLocaleString()} A-Coins</p>
                      <p className="text-[11px] text-zinc-500">{lang === 'en' ? pack.bonusEn : pack.bonusEs}</p>
                    </div>
                    <button
                      onClick={() => {
                        setCurrentUser((prev) => ({ ...prev, aCoins: prev.aCoins + pack.aCoins }));
                        setShowTopUpModal(false);
                        notify(`+${pack.aCoins.toLocaleString()} A-Coins`, `$${pack.priceUSD} USD`);
                      }}
                      className="px-4 py-2 rounded-xl bg-zinc-950 text-white font-black text-xs cursor-pointer"
                    >
                      ${pack.priceUSD} USD
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
