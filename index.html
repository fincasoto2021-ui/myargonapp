                            className="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                          >
                            {post.adRewardClaimed ? '✓ +25 A Cobrados' : '🎁 Ver Oferta (+25 A-Coins)'}
                          </button>
                        </div>
                      )}
                    </article>
                  ))}
                </>
              )}

              {activeTab === 'amigos' && (
                <div className="p-5 rounded-2xl bg-[#161B26] border border-slate-800 space-y-4">
                  <h2 className="font-black text-amber-400 text-base">Sigue Artistas y Usuarios y Cobra +50 A-Coins</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {people.map(p => (
                      <div key={p.id} className="p-3 rounded-xl bg-[#0F131A] border border-slate-800 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <img src={p.avatar} className="w-10 h-10 rounded-full object-cover" />
                          <div>
                            <p className="font-bold text-xs">{p.name}</p>
                            <p className="text-[11px] text-slate-400">{p.category}</p>
                          </div>
                        </div>
                        <button
                          disabled={p.followed}
                          onClick={() => {
                            setPeople(people.map(x => x.id === p.id ? { ...x, followed: true } : x));
                            setUser(prev => ({ ...prev, aCoins: prev.aCoins + 50 }));
                            notify('+50 A-Coins Cobrados', `Seguiste a ${p.name}`);
                          }}
                          className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs cursor-pointer"
                        >
                          {p.followed ? '✓ Seguido' : 'Seguir (+50A)'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'bolsa' && (
                <div className="p-5 rounded-2xl bg-[#161B26] border border-slate-800 space-y-3">
                  <h2 className="font-black text-amber-400 text-base">Bolsa de Seguidores ARGON</h2>
                  {packages.map(pkg => (
                    <div key={pkg.id} className="p-4 rounded-xl bg-[#0F131A] border border-slate-800 flex items-center justify-between">
                      <div>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">{pkg.badge}</span>
                        <h4 className="font-bold text-sm mt-1">{pkg.title}</h4>
                        <p className="text-xs text-slate-400">+{pkg.followersCount.toLocaleString()} Seguidores</p>
                      </div>
                      <button
                        onClick={() => {
                          if (user.aCoins < pkg.priceACoins) {
                            setShowTopUpModal(true);
                            return;
                          }
                          setUser(prev => ({ ...prev, aCoins: prev.aCoins - pkg.priceACoins, followers: prev.followers + pkg.followersCount }));
                          notify(`¡+${pkg.followersCount.toLocaleString()} Seguidores!`, 'Acreditados en tu cuenta.');
                        }}
                        className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                      >
                        Comprar ({pkg.priceACoins.toLocaleString()} A)
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {activeTab === 'patrocinadores' && (
                <div className="p-5 rounded-2xl bg-[#161B26] border border-emerald-500/40 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="font-black text-xl text-white">Tu Saldo Stripe: ${user.usdBalance.toFixed(2)} USD</h2>
                      <p className="text-xs text-slate-400">Desbloquea marcas desde Rango Magnate (25,000 seguidores).</p>
                    </div>
                    {currentRank.level < 2 && (
                      <button
                        onClick={() => {
                          setUser(prev => ({ ...prev, followers: 25000 }));
                          notify('¡Subiste a MAGNATE!', 'Ya puedes cobrar en dólares.');
                        }}
                        className="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-black text-xs cursor-pointer"
                      >
                        Activar Magnate (25K)
                      </button>
                    )}
                  </div>
                  {sponsors.map(sp => {
                    const unlocked = currentRank.level >= sp.minRankLevel;
                    return (
                      <div key={sp.id} className="p-4 rounded-xl bg-[#0F131A] border border-slate-800 flex items-center justify-between">
                        <div>
                          <h4 className="font-bold text-sm">{sp.brand}</h4>
                          <p className="text-xs text-slate-400">{sp.description}</p>
                        </div>
                        <button
                          disabled={!unlocked || sp.completed}
                          onClick={() => {
                            const gain = +(sp.payoutUSD * 0.8).toFixed(2);
                            setUser(prev => ({ ...prev, usdBalance: +(prev.usdBalance + gain).toFixed(2) }));
                            setSponsors(sponsors.map(x => x.id === sp.id ? { ...x, completed: true } : x));
                            notify(`¡+$${gain} USD Acreditados!`, 'Listos para retirar por Stripe Connect.');
                          }}
                          className={`px-4 py-2 rounded-xl font-black text-xs cursor-pointer ${
                            sp.completed ? 'bg-slate-800 text-emerald-400' : unlocked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-500'
                          }`}
                        >
                          {sp.completed ? '✓ Cobrado' : unlocked ? `Cobrar +$${(sp.payoutUSD * 0.8).toFixed(0)} USD` : 'Requiere Magnate'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}

              {activeTab === 'perfil' && (
                <div className="p-5 rounded-2xl bg-[#161B26] border border-slate-800 space-y-3">
                  <h2 className="font-black text-xl text-amber-400">{user.name} ({currentRank.icon} {currentRank.name})</h2>
                  <p className="text-xs text-slate-300">{user.bio}</p>
                  <div className="grid grid-cols-3 gap-2 pt-2">
                    <div className="p-3 rounded-xl bg-[#0F131A] border border-slate-800">
                      <span className="text-[11px] text-slate-400 block">A-Coins</span>
                      <strong className="text-amber-400">{user.aCoins.toLocaleString()}</strong>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0F131A] border border-slate-800">
                      <span className="text-[11px] text-slate-400 block">Seguidores</span>
                      <strong>{user.followers.toLocaleString()}</strong>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0F131A] border border-slate-800">
                      <span className="text-[11px] text-slate-400 block">Dólares</span>
                      <strong className="text-emerald-400">${user.usdBalance.toFixed(2)} USD</strong>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* PIE DE PÁGINA CORPORATIVO */}
          <footer className="max-w-6xl mx-auto px-6 py-6 border-t border-slate-800 text-center text-xs text-slate-400 space-y-1">
            <p className="font-bold text-slate-200">© 2026 <span className="text-amber-400">ARGON™</span> (myargonapp.com) — Todos los Derechos Reservados.</p>
            <p>Propiedad Corporativa de <strong>ASD BUILDING SOLUTIONS LLC</strong> (Reg. Depto. de Estado PR <strong>#510231</strong>) y <strong>FINCA SOTO LLC</strong> (SURI <strong>#1433044-0010</strong> • Adjuntas, PR 00601).</p>
          </footer>

          {/* MODAL RECARGA STRIPE */}
          {showTopUpModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-[#161B26] border border-amber-400 p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-black text-amber-400">Recarga A-Coins con Stripe</h3>
                  <button onClick={() => setShowTopUpModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                {TOPUP_PACKS.map(pack => (
                  <div key={pack.id} className="p-3.5 rounded-xl bg-[#0F131A] border border-slate-800 flex justify-between items-center">
                    <div>
                      <p className="font-black text-sm text-white">+{pack.aCoins.toLocaleString()} A-Coins</p>
                      <p className="text-[11px] text-slate-400">{pack.bonusText}</p>
                    </div>
                    <button
                      onClick={() => {
                        setUser(prev => ({ ...prev, aCoins: prev.aCoins + pack.aCoins }));
                        setShowTopUpModal(false);
                        notify(`¡+${pack.aCoins.toLocaleString()} A-Coins Recargados!`, `Pago Stripe $${pack.priceUSD} USD completado.`);
                      }}
                      className="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-black text-xs cursor-pointer"
                    >
                      Stripe ${pack.priceUSD}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* MODAL VIDEO PROMO 25S */}
          {showPromoVideo && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4">
              <div className="w-full max-w-sm flex justify-between items-center mb-2">
                <span className="text-xs font-black text-amber-400">👑 VIDEO PROMO ARGON • {promoSecond.toFixed(1)}s / 25.0s</span>
                <button onClick={() => setShowPromoVideo(false)} className="px-3 py-1 rounded-full bg-slate-800 text-white text-xs font-bold">✕ Cerrar</button>
              </div>
              <div className="w-full max-w-sm rounded-3xl bg-[#161B26] border-2 border-amber-400 p-4 space-y-3 text-center">
                <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                  <div className="h-full bg-amber-400" style={{ width: `${(promoSecond / 25) * 100}%` }} />
                </div>
                <p className="font-black text-base text-white">
                  {promoSecond < 8 ? '🔥 1. Wisin Oficial te da +50 A-Coins al seguirlo' :
                   promoSecond < 15 ? '👑 2. Sigues a Farruko Oficial y sumas +100 A-Coins' :
                   promoSecond < 20 ? '🚀 3. Subes tu cuenta a RANGO MAGNATE (25,000 seg)' :
                   '💵 4. ¡Cobras +$1,800 USD directo por Stripe Connect!'}
                </p>
                <div className="p-4 rounded-2xl bg-[#0F131A] border border-slate-800">
                  <p className="text-xs text-slate-400">Monedas en Vivo:</p>
                  <p className="text-2xl font-black text-amber-400">
                    🪙 {promoSecond < 4 ? '5,050' : promoSecond < 12 ? '5,100' : '35,000'} A-Coins
                  </p>
                  <p className="text-lg font-black text-emerald-400 mt-1">
                    💵 {promoSecond >= 18 ? '+$1,800.00 USD (Stripe)' : '$0.00 USD'}
                  </p>
                </div>
                <p className="text-xs font-black text-amber-300">Entra hoy a: MYARGONAPP.COM 👑</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
